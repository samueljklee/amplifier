[project]
name = "analyze-review-sentiment"
description = "Analyze customer reviews from PDFs and identify actionable feedback"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "amplifier",
    "click>=8.0",
    "pypdf>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analyze_review_sentiment"]

[tool.uv.sources]
amplifier = { path = "../../", editable = true }

[tool.amplifier.workflow]
stages = [
    { id = "pdf_input", type = "input", label = "PDF Input", prompt = "Select PDF file containing customer reviews" },
    { id = "extract_text", type = "process", label = "Extract Text", depends_on = ["pdf_input"] },
    { id = "analyze_sentiment", type = "process", label = "Analyze Sentiment & Actionability", depends_on = ["extract_text"] },
    { id = "generate_report", type = "output", label = "Generate Report", depends_on = ["analyze_sentiment"] }
]

[tool.amplifier.workflow.layout]
# Linear workflow: input -> extract -> analyze -> report
positions.pdf_input = [100, 150]
positions.extract_text = [350, 150]
positions.analyze_sentiment = [600, 150]
positions.generate_report = [850, 150]
