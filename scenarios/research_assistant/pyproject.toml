[project]
name = "research-assistant"
version = "0.1.0"
description = "AI-powered comprehensive research tool with multi-stage workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pyright>=1.1.0",
]
